# Explicit opt-in configuration is owned by the profile Host. No implicit environment binding.
- insert:
    - id: pap-client-declaration
      name: '@awiki/dsh-pap'
    - id: pap
      name: '@awiki/dsh-pap/plugin'
      config:
        enabled: false
        # To select file storage explicitly, also set stateRoot and policyRef.
        # secretStore: local-file
        # secretsRoot: /absolute/private/dsh/secrets/pap
    - id: pap-manager
      name: '@awiki/dsh-pap/management-remote'
    - id: pap-tools
      name: '@awiki/dsh-pap/tools'
